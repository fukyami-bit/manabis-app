<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#12212E; --ink-2:#5A6672; --line:#DFDCD4; --paper:#F5F3EE; --card:#FFF;
    --accent:#0E6E6B; --accent-dark:#0A514F;
    --ok:#1B7A5A; --ok-bg:#E4F2EC; --warn:#B06A0F; --warn-bg:#FBF0DC; --ng:#B23A2E; --ng-bg:#FAE7E4;
    --gothic:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic Medium","Noto Sans JP",sans-serif;
    --num:ui-monospace,"SF Mono",Menlo,monospace;
    --tab-h:60px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--gothic);font-size:15px;
    line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom))}
  button,input,select{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer;border:none;background:none}
  header{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:10px 14px}
  .hd{display:flex;align-items:center;gap:12px}
  .hd h1{margin:0;font-size:16px;font-weight:600;flex:1}
  .hd .clock{font-family:var(--num);font-size:13px;opacity:.8}
  .kpi{display:flex;gap:8px;margin-top:9px}
  .kpi div{flex:1;background:rgba(255,255,255,.1);border-radius:8px;padding:6px 4px;text-align:center}
  .kpi b{display:block;font-family:var(--num);font-size:19px;line-height:1.15}
  .kpi small{font-size:10px;opacity:.75}
  .kpi div.hot{background:#8C2E24}
  .kpi div.amb{background:#8A5A10}
  main{max-width:860px;margin:0 auto;padding:12px 12px 20px}
  .sec{margin-bottom:18px}
  .sec>h2{margin:0 0 8px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
  .sec>h2 em{font-style:normal;font-family:var(--num);font-size:12px;color:var(--ink-2)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:14px;margin-bottom:11px}
  .card h3{margin:0 0 4px;font-size:15px;font-weight:600}
  .card p{margin:0 0 11px;font-size:12.5px;color:var(--ink-2)}
  .empty{background:var(--card);border:1px dashed var(--line);border-radius:11px;padding:26px 16px;
    text-align:center;color:var(--ink-2);font-size:13px}
  .row{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
    border-left:4px solid var(--bc,#CFCABE);border-radius:10px;padding:10px 12px;margin-bottom:7px}
  .row .tm{flex-shrink:0;font-family:var(--num);font-size:15px;font-weight:600;width:44px}
  .row .nm{flex:1;min-width:0}
  .row .nm b{display:block;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .nm small{display:block;font-size:11.5px;color:var(--ink-2)}
  .row .bo{flex-shrink:0;text-align:center;min-width:58px;font-family:var(--num)}
  .row .bo b{display:block;font-size:19px;line-height:1.1}
  .row .bo small{display:block;font-size:10px;color:var(--ink-2);font-family:var(--gothic)}
  .row .act{flex-shrink:0}
  .tag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:999px;margin-left:5px;
    vertical-align:1px;font-weight:600}
  .t-ok{background:var(--ok-bg);color:var(--ok)}
  .t-warn{background:var(--warn-bg);color:var(--warn)}
  .t-ng{background:var(--ng-bg);color:var(--ng)}
  .t-mut{background:#EDEBE4;color:var(--ink-2)}
  .bchk{min-width:96px;min-height:42px;border-radius:9px;border:1.5px solid #BFD8D6;background:#fff;
    color:var(--accent);font-size:13.5px;font-weight:600}
  .bchk.done{border-color:var(--line);background:#F2F1EC;color:var(--ink-2);font-weight:400}
  .btn{display:block;width:100%;padding:13px;background:var(--accent);color:#fff;border-radius:10px;
    font-weight:600;text-align:center}
  .btn:disabled{background:#B9BEC2}
  .btn.sub{background:#fff;color:var(--accent);border:1.5px solid #BFD8D6}
  .btn.warnbtn{background:#fff;color:var(--ng);border:1.5px solid #E8C4BE}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  label.f{display:block;margin-bottom:10px;font-size:12.5px;color:var(--ink-2)}
  label.f input,label.f select{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;
    background:#fff;color:var(--ink);font-size:15px;margin-top:4px}
  label.f input[inputmode=numeric]{font-family:var(--num);font-size:19px;text-align:center}
  .file{display:block;width:100%;padding:14px;border:1.5px dashed var(--line);border-radius:10px;
    background:#FCFBF8;text-align:center;font-size:14px;cursor:pointer}
  .file.set{border-style:solid;border-color:#BFD8D6;background:#F1F8F7}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.97);
    backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;padding:8px 2px;font-size:10.5px;color:var(--ink-2);display:flex;flex-direction:column;
    align-items:center;gap:2px;position:relative}
  nav button.on{color:var(--accent);font-weight:600}
  nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  nav .dot{position:absolute;top:5px;right:50%;margin-right:-20px;min-width:16px;height:16px;border-radius:999px;
    background:var(--ng);color:#fff;font-size:10px;font-family:var(--num);line-height:16px;font-weight:700;padding:0 3px}
  .sheet{position:fixed;inset:0;z-index:1200;background:rgba(18,33,46,.45);display:flex;align-items:flex-end;justify-content:center}
  .sheet-in{background:var(--paper);width:100%;max-width:560px;max-height:92vh;border-radius:15px 15px 0 0;
    display:flex;flex-direction:column;overflow:hidden}
  .sheet-hd{padding:13px 14px;background:var(--card);border-bottom:1px solid var(--line);display:flex;
    align-items:center;gap:10px}
  .sheet-hd b{flex:1;font-size:16px}
  .sheet-hd button{min-height:40px;padding:8px 14px;border:1px solid var(--line);border-radius:9px;background:#fff}
  .sheet-bd{overflow-y:auto;padding:14px 14px calc(18px + env(safe-area-inset-bottom))}
  .toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + 18px);transform:translateX(-50%);background:var(--ink);
    color:#fff;padding:11px 18px;border-radius:999px;font-size:13.5px;z-index:1300;opacity:0;
    transition:opacity .2s;pointer-events:none;white-space:nowrap;max-width:92vw}
  .toast.show{opacity:1}
  textarea{width:100%;min-height:96px;padding:10px;border:1px solid var(--line);border-radius:9px;
    background:#fff;color:var(--ink);font-family:var(--num);font-size:12px;resize:vertical}
  textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .pv{margin-top:11px;padding:11px 13px;border-radius:9px;font-size:12.5px}
  .pv.ok{background:var(--ok-bg);color:var(--ok)}
  .pv.err{background:var(--ng-bg);color:var(--ng)}
  .pv b{font-size:14px}
  table.pvt{width:100%;border-collapse:collapse;font-size:11.5px;background:#fff;color:var(--ink);
    margin-top:6px;border-radius:6px;overflow:hidden}
  table.pvt th{background:#EDEBE4;padding:4px 5px;font-weight:600;text-align:left;white-space:nowrap}
  table.pvt td{border-top:1px solid #EEEBE4;padding:4px 5px;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;max-width:110px}
  .qr{font-size:12px;color:var(--ink-2);word-break:break-all;font-family:var(--num);background:#F0EEE7;
    padding:9px 11px;border-radius:8px;line-height:1.5}
</style>
</head>
<body>
<header>
  <div class="hd">
    <h1>来校管理 受付</h1>
    <span class="clock" id="clock">—</span>
  </div>
  <div class="kpi" id="kpi"></div>
</header>
<main id="view"><div class="empty">読み込んでいます…</div></main>
<nav id="nav"></nav>
<div class="toast" id="toast"></div>

<script>
var TOKEN = '<?= token ?>';
var PAGE_KEY = '<?= pageKey ?>';
var EXEC_URL = '<?= execUrl ?>';

var st = { tab:'desk', data:null, sheetOpen:false, loading:false, err:'' };
var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };

function call(fn, req){
  req = req || {}; req.token = TOKEN;
  return new Promise(function(res, rej){
    google.script.run.withSuccessHandler(res).withFailureHandler(function(e){
      rej(new Error(e && e.message ? e.message : '通信できませんでした')); })[fn](req);
  });
}
function toast(m){
  var t = $('toast'); t.textContent = m; t.className = 'toast show';
  setTimeout(function(){ t.className = 'toast'; }, 2200);
}

/* ---------- 読み込み ---------- */
function load(silent){
  if (st.loading) return Promise.resolve();
  st.loading = true;
  return call('api_list', {}).then(function(r){
    st.loading = false;
    if (!r.ok){ st.err = r.error; if(!silent) toast(r.error); return; }
    st.err = ''; st.data = r; render();
  }).catch(function(e){
    st.loading = false; st.err = e.message; if(!silent) toast(e.message);
  });
}

/* ---------- 画面 ---------- */
var ICONS = {
  desk:'<path d="M3 7h18M5 7v12M19 7v12M3 19h18"/><path d="M9 11h6"/>',
  wait:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  next:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  data:'<path d="M4 7v10c0 1.7 3.6 3 8 3s8-1.3 8-3V7"/><ellipse cx="12" cy="7" rx="8" ry="3"/>'
};
function renderNav(){
  var d = st.data, tabs = [
    ['desk','受付', d ? d.counts.unhanded : 0],
    ['wait','未来校', d ? d.counts.alert : 0],
    ['next','次回予定', 0],
    ['data','データ', 0]
  ];
  $('nav').innerHTML = tabs.map(function(t){
    return '<button data-tab="'+t[0]+'" class="'+(st.tab===t[0]?'on':'')+'">'+
      '<svg viewBox="0 0 24 24">'+ICONS[t[0]]+'</svg>'+t[1]+
      (t[2] ? '<span class="dot">'+t[2]+'</span>' : '')+'</button>';
  }).join('');
  $('nav').querySelectorAll('button').forEach(function(b){
    b.addEventListener('click', function(){ st.tab = b.dataset.tab; render(); });
  });
}

function renderHead(){
  var d = st.data;
  $('clock').textContent = d ? (d.date + '　' + d.now) : (st.err ? '接続エラー' : '—');
  if (!d){ $('kpi').innerHTML = ''; return; }
  var c = d.counts;
  $('kpi').innerHTML =
    '<div><b>'+c.visit+'</b><small>来校</small></div>'+
    '<div class="'+(c.unhanded?'amb':'')+'"><b>'+c.unhanded+'</b><small>未配布</small></div>'+
    '<div class="'+(c.alert?'hot':'')+'"><b>'+c.alert+'</b><small>要電話</small></div>'+
    '<div><b>'+c.reserved+'</b><small>未来校</small></div>';
}

function render(){
  renderHead(); renderNav();
  var v = $('view'), d = st.data;
  if (!d){
    v.innerHTML = '<div class="empty">'+(st.err ? esc(st.err) : '読み込んでいます…')+'</div>';
    return;
  }
  if (st.tab === 'desk') renderDesk(v);
  else if (st.tab === 'wait') renderWait(v);
  else if (st.tab === 'next') renderNext(v);
  else renderData(v);
}

function visitRow(x, queue){
  var tags = '';
  if (x.status === '遅刻') tags += '<span class="tag t-warn">遅刻</span>';
  if (x.via === '代理') tags += '<span class="tag t-mut">代理</span>';
  if (!x.reservedAt) tags += '<span class="tag t-mut">予約なし</span>';
  var bc = x.handed ? '#CFCABE' : '#B06A0F';
  return '<div class="row" style="--bc:'+bc+'">'+
    '<span class="tm">'+esc(x.at)+'</span>'+
    '<span class="nm"><b>'+esc(x.name)+tags+'</b>'+
      '<small>'+esc(x.grade)+'　'+esc(x.purpose)+
      (x.reservedAt ? '　予約'+esc(x.reservedAt) : '')+
      (x.next ? '　次回'+esc(x.next) : '')+'</small></span>'+
    '<span class="bo"><b>'+esc(String(x.booth))+'</b><small>'+esc(x.boothKind.replace('ブース','').replace('自習室','自習室'))+'</small></span>'+
    '<span class="act"><button class="bchk '+(x.handed?'done':'')+'" data-hand="'+esc(x.id)+'" data-undo="'+(x.handed?'1':'')+'">'+
      (x.handed ? '配布 '+esc(x.handed) : 'ファイル渡した')+'</button></span>'+
    '</div>';
}

function renderDesk(v){
  var d = st.data;
  var un = d.visits.filter(function(x){ return !x.handed; });
  var hd = d.visits.filter(function(x){ return x.handed; });
  v.innerHTML =
    '<div class="sec"><h2>ファイル未配布 <em>'+un.length+'件</em></h2>'+
      (un.length ? un.map(function(x){ return visitRow(x, true); }).join('')
                 : '<div class="empty">未配布はありません</div>')+'</div>'+
    '<button class="btn sub" id="btnProxy" style="margin-bottom:18px">代理で来校登録する</button>'+
    '<div class="sec"><h2>配布済み <em>'+hd.length+'件</em></h2>'+
      (hd.length ? hd.map(function(x){ return visitRow(x, false); }).join('')
                 : '<div class="empty">まだありません</div>')+'</div>'+
    (d.absent.length ? '<div class="sec"><h2>欠席 <em>'+d.absent.length+'件</em></h2>'+
      d.absent.map(function(a){
        return '<div class="row" style="--bc:#B23A2E"><span class="nm"><b>'+esc(a.name)+
          '<span class="tag t-ng">'+esc(a.status)+'</span></b></span>'+
          '<span class="act"><button class="bchk" data-undo-abs="'+esc(a.id)+'">取消</button></span></div>';
      }).join('')+'</div>' : '');
  bindDesk();
}

function bindDesk(){
  document.querySelectorAll('[data-hand]').forEach(function(b){
    b.addEventListener('click', function(){
      b.disabled = true;
      call('api_handover', { id:b.dataset.hand, undo: !!b.dataset.undo }).then(function(r){
        if (!r.ok) { toast(r.error); b.disabled = false; return; }
        load(true);
      }).catch(function(e){ toast(e.message); b.disabled = false; });
    });
  });
  document.querySelectorAll('[data-undo-abs]').forEach(function(b){
    b.addEventListener('click', function(){
      if (!confirm('この欠席の記録を取り消しますか？')) return;
      call('api_remove', { id:b.dataset.undoAbs }).then(function(r){
        if (!r.ok) return toast(r.error);
        toast('取り消しました'); load(true);
      }).catch(function(e){ toast(e.message); });
    });
  });
  var p = $('btnProxy');
  if (p) p.addEventListener('click', openProxy);
}

function renderWait(v){
  var d = st.data;
  var alert = d.pending.filter(function(p){ return p.alert; });
  var soon = d.pending.filter(function(p){ return !p.alert; });
  v.innerHTML =
    '<div class="sec"><h2>要電話 <em>'+alert.length+'件</em></h2>'+
      '<p style="margin:-2px 0 9px;font-size:12px;color:var(--ink-2)">予約時刻を過ぎても来校していません。電話番号は本部システムで検索してください。</p>'+
      (alert.length ? alert.map(pendRow).join('') : '<div class="empty">ありません</div>')+'</div>'+
    '<div class="sec"><h2>これから来る予定 <em>'+soon.length+'件</em></h2>'+
      (soon.length ? soon.map(pendRow).join('') : '<div class="empty">ありません</div>')+'</div>';
  document.querySelectorAll('[data-abs]').forEach(function(b){
    b.addEventListener('click', function(){
      var no = b.dataset.abs, nm = b.dataset.nm;
      var s = b.dataset.kind;
      if (!confirm(nm + ' さんを「' + s + '」として登録しますか？')) return;
      call('api_setStatus', { no:no, status:s }).then(function(r){
        if (!r.ok) return toast(r.error);
        toast(s + 'で登録しました'); load(true);
      }).catch(function(e){ toast(e.message); });
    });
  });
}

function pendRow(p){
  return '<div class="row" style="--bc:'+(p.alert?'#B23A2E':'#CFCABE')+'">'+
    '<span class="tm">'+esc(p.at||'—')+'</span>'+
    '<span class="nm"><b>'+esc(p.name)+(p.alert?'<span class="tag t-ng">要電話</span>':'')+'</b>'+
      '<small>'+esc(p.grade)+'</small></span>'+
    '<span class="act" style="display:flex;gap:6px">'+
      '<button class="bchk" style="min-width:62px" data-abs="'+esc(p.no)+'" data-nm="'+esc(p.name)+'" data-kind="欠席">欠席</button>'+
      '<button class="bchk" style="min-width:74px;border-color:#E8C4BE;color:#B23A2E" data-abs="'+esc(p.no)+'" data-nm="'+esc(p.name)+'" data-kind="無断欠席">無断欠席</button>'+
    '</span></div>';
}

function renderNext(v){
  var list = st.data.nextVisits;
  v.innerHTML =
    '<div class="card"><h3>自習者の次回来校予定</h3>'+
      '<p>自習の生徒は受講ブースのPCで次回予約が取れないため、ここに出た分を本部システムへ予約として入力してください。</p>'+
      (list.length
        ? '<div class="row2" style="grid-template-columns:1fr;gap:0">'+list.map(function(x){
            return '<div class="row" style="--bc:#0E6E6B;margin-bottom:6px">'+
              '<span class="nm"><b>'+esc(x.name)+'</b><small>生番号 '+esc(x.no)+'</small></span>'+
              '<span class="bo" style="min-width:94px"><b style="font-size:15px">'+esc(x.next)+'</b><small>次回予定</small></span>'+
              '</div>';
          }).join('')+'</div>'+
          '<button class="btn sub" id="btnCopyNext" style="margin-top:10px">一覧をコピー</button>'
        : '<div class="empty">本日まだありません</div>')+
    '</div>';
  var b = $('btnCopyNext');
  if (b) b.addEventListener('click', function(){
    var t = list.map(function(x){ return x.no + '\t' + x.name + '\t' + x.next; }).join('\n');
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(function(){ toast('コピーしました'); });
    else toast('コピーできませんでした');
  });
}

function renderData(v){
  var d = st.data;
  v.innerHTML =
    '<div class="card"><h3>生徒名簿の取り込み</h3>'+
      '<p>本部システムの顧客情報一覧を取り込みます。'+
      '<b>生徒番号・氏名・氏名カナ・学年・高校名だけ</b>を送ります。'+
      '保護者氏名・住所・電話番号・生年月日はこの端末から出ません。</p>'+
      '<p style="color:var(--ink)">'+(d.rosterCount ? '現在 '+d.rosterCount+'名 登録済み' : 'まだ登録されていません')+'</p>'+
      '<label class="file" id="lblRos">ファイルを選ぶ（.xlsx / .xlsm / .csv）'+
        '<input type="file" id="fRos" accept=".xlsx,.xlsm,.csv" style="display:none"></label>'+
      '<p style="margin:11px 0 5px">または、本部システムの画面をコピーして下に貼り付け</p>'+
      '<textarea id="paRos" placeholder="ここに貼り付け（Ctrl+V）"></textarea>'+
      '<button class="btn sub" id="btnRos">貼り付けた内容を確認する</button>'+
      '<div id="pvRos"></div>'+
    '</div>'+
    '<div class="card"><h3>来校予約の取り込み</h3>'+
      '<p>同じ予約日の分は置き換わるので、日中に貼り直しても二重になりません。</p>'+
      '<p style="color:var(--ink)">'+(d.resCount ? '本日 '+d.resCount+'件 登録済み' : '本日の予約はまだありません')+'</p>'+
      '<label class="file" id="lblRes">ファイルを選ぶ（.xlsx / .xlsm / .csv）'+
        '<input type="file" id="fRes" accept=".xlsx,.xlsm,.csv" style="display:none"></label>'+
      '<p style="margin:11px 0 5px">または、本部システムの画面をコピーして下に貼り付け</p>'+
      '<textarea id="paRes" placeholder="ここに貼り付け（Ctrl+V）"></textarea>'+
      '<label class="f" style="margin-top:8px">貼り付けた表に予約日の列が無い場合に使う日付'+
        '<input type="date" id="resDate" value="'+esc(d.date)+'"></label>'+
      '<button class="btn sub" id="btnRes">貼り付けた内容を確認する</button>'+
      '<div id="pvRes"></div>'+
    '</div>'+
    '<div class="card"><h3>生徒用フォームのQRコード</h3>'+
      '<p>このURLをQRコードにして校舎に掲示してください。合言葉は入っていないので、生徒に見られても受付画面は開けません。</p>'+

var pending = { roster:null, res:null };

function preview(kind){
  var ta = $(kind === 'roster' ? 'paRos' : 'paRes');
  var box = $(kind === 'roster' ? 'pvRos' : 'pvRes');
  var rows = parseTable(ta.value);
  if (rows.length < 2){
    box.innerHTML = '<div class="pv err">表として読み取れませんでした。本部システムの画面で表を選択してコピーし直してください。</div>';
    return;
  }
  var fallback = kind === 'res' ? $('resDate').value : '';
  var r = kind === 'roster' ? detectRoster(rows) : detectRes(rows, fallback);
  pending[kind] = r.items;
  box.innerHTML = reportHtml(r, kind);
  var b = $('pvGo-' + kind);
  if (b) b.addEventListener('click', function(){ send(kind); });
}

function reportHtml(r, kind){
  if (!r.items.length){
    return '<div class="pv err"><b>取り込める行がありませんでした</b>'+
      '<div>'+esc(r.note)+'</div></div>';
  }
  var head = kind === 'roster' ? ['生徒番号','氏名','カナ','学年','高校名'] : ['生徒番号','氏名','学年','予約日','予約時刻'];
  var keys = kind === 'roster' ? ['no','name','kana','grade','school'] : ['no','name','grade','date','at'];
  var sample = r.items.slice(0, 3);
  return '<div class="pv ok">'+
    '<b>'+r.items.length+'件 読み取れました</b>'+
    '<div style="margin:5px 0 8px">'+esc(r.note)+'</div>'+
    '<table class="pvt"><tr>'+head.map(function(h){ return '<th>'+h+'</th>'; }).join('')+'</tr>'+
      sample.map(function(it){
        return '<tr>'+keys.map(function(k){ return '<td>'+esc(it[k]||'—')+'</td>'; }).join('')+'</tr>';
      }).join('')+
    '</table>'+
    '<p style="margin:8px 0 0;font-size:12px">この3件が正しければ取り込んでください。ずれていたら、本部システムで表の見出しごとコピーし直すと精度が上がります。</p>'+
    '<button class="btn" id="pvGo-'+kind+'" style="margin-top:9px">この内容で取り込む</button>'+
    '</div>';
}

function send(kind){
  var items = pending[kind];
  if (!items || !items.length) return;
  var b = $('pvGo-' + kind);
  if (b){ b.disabled = true; b.textContent = '取り込んでいます…'; }
  var fn = kind === 'roster' ? 'api_importRoster' : 'api_importReservations';
  call(fn, { items: items }).then(function(r){
    if (!r.ok) throw new Error(r.error);
    toast(kind === 'roster' ? ('名簿を ' + r.count + '名 取り込みました')
                            : ('予約を ' + r.count + '件 取り込みました（' + r.days.join('・') + '）'));
    pending[kind] = null;
    load(true);
  }).catch(function(e){
    toast(e.message);
    if (b){ b.disabled = false; b.textContent = 'この内容で取り込む'; }
  });
}

/* ---------- 表の読み取り ---------- */

function xlDate(v){
  if (typeof v === 'number'){
    if (!isFinite(v) || v < 1) return '';
    // Excelのシリアル値。エポックは1899-12-30。
    // 1900年を閏年として扱う既知のずれは、下の年範囲チェックで一律に弾かれる。
    var d = new Date(Date.UTC(1899,11,30) + Math.floor(v)*86400000);
    var y = d.getUTCFullYear();
    if (y < 2000 || y > 2100) return '';   // 日付として考えにくい値は取り込まない
    return y+'-'+('0'+(d.getUTCMonth()+1)).slice(-2)+'-'+('0'+d.getUTCDate()).slice(-2);
  }
  var s = String(v==null?'':v).trim();
  var m = s.match(/(\d{4})\D(\d{1,2})\D(\d{1,2})/);
  if (m){
    var mo = Number(m[2]), da = Number(m[3]);
    if (mo < 1 || mo > 12 || da < 1 || da > 31) return '';
    return m[1]+'-'+('0'+mo).slice(-2)+'-'+('0'+da).slice(-2);
  }
  // 年のない「10/4」「10月4日」は、画面に年が出ない本部システムの表に備えて今年とみなす
  var m2 = s.match(/^(\d{1,2})\D{1,2}(\d{1,2})\D?$/);
  if (m2){
    var mo2 = Number(m2[1]), da2 = Number(m2[2]);
    if (mo2 < 1 || mo2 > 12 || da2 < 1 || da2 > 31) return '';
    return new Date().getFullYear()+'-'+('0'+mo2).slice(-2)+'-'+('0'+da2).slice(-2);
  }
  return '';
}
function xlTime(v){
  if (typeof v === 'number'){
    if (!isFinite(v) || v < 0) return '';
    var mins = Math.round((v - Math.floor(v)) * 1440) % 1440;
    return ('0'+Math.floor(mins/60)).slice(-2)+':'+('0'+(mins%60)).slice(-2);
  }
  var m = String(v==null?'':v).match(/(\d{1,2}):(\d{2})/);
  if (!m) return '';
  if (Number(m[1]) > 23 || Number(m[2]) > 59) return '';
  return ('0'+m[1]).slice(-2)+':'+m[2];
}

/** 貼り付けられた文字列を表にする。区切りはタブ優先、無ければカンマ。 */
function parseTable(text){
  var lines = String(text==null?'':text).replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n')
    .filter(function(l){ return l.trim() !== ''; });
  if (!lines.length) return [];
  var sep = lines.filter(function(l){ return l.indexOf('\t') >= 0; }).length >= lines.length/2 ? '\t'
          : (lines.filter(function(l){ return l.indexOf(',') >= 0; }).length >= lines.length/2 ? ',' : null);
  if (!sep) return [];
  return lines.map(function(l){
    return l.split(sep).map(function(c){ return String(c).replace(/^"|"$/g,'').trim(); });
  });
}

var HEADER_WORDS = /氏名|名前|番号|学年|予約日|予約時刻|校舎|カナ|学校|在籍|講座/;

/** 先頭の見出し行を取り除き、見出しがあれば列名も返す */
function stripHeader(rows){
  if (!rows.length) return { head:null, body:rows };
  var first = rows[0].map(function(c){ return String(c).replace(/[\s　]/g,''); });
  var hits = first.filter(function(c){ return HEADER_WORDS.test(c); }).length;
  return hits >= 2 ? { head:first, body:rows.slice(1) } : { head:null, body:rows };
}

function width(rows){
  var w = 0;
  rows.forEach(function(r){ if (r.length > w) w = r.length; });
  return w;
}

/** 条件に最もよく当てはまる列を選ぶ。該当が7割未満の列は選ばない。 */
function pickCol(rows, test, skip){
  var w = width(rows), best = -1, bestHit = 0;
  for (var c = 0; c < w; c++){
    if (skip && skip.indexOf(c) >= 0) continue;
    var hit = 0, tot = 0;
    for (var i = 0; i < rows.length; i++){
      var v = rows[i][c];
      if (v === undefined || String(v).trim() === '') continue;
      tot++; if (test(String(v).trim())) hit++;
    }
    if (tot >= Math.max(1, rows.length * 0.5) && hit >= tot * 0.7 && hit > bestHit){ bestHit = hit; best = c; }
  }
  return best;
}

/** 文字列の列のうち、異なり数が最も多いものを選ぶ（氏名を見つけるため） */
function pickTextCol(rows, skip, maxDistinctRatio){
  var w = width(rows), best = -1, bestD = 1;
  for (var c = 0; c < w; c++){
    if (skip && skip.indexOf(c) >= 0) continue;
    var vals = {}, tot = 0, txt = 0;
    for (var i = 0; i < rows.length; i++){
      var s = String(rows[i][c] == null ? '' : rows[i][c]).trim();
      if (!s) continue;
      tot++;
      if (/[^\d\-\/:.]/.test(s) && s.length <= 20){ txt++; vals[s] = 1; }
    }
    if (!tot || txt < tot * 0.8) continue;
    var d = Object.keys(vals).length;
    if (maxDistinctRatio && d > tot * maxDistinctRatio) continue;
    if (d > bestD){ bestD = d; best = c; }
  }
  return best;
}

/**
 * 生徒番号の列を選ぶ。数字の並びというだけでは校舎コードのような
 * 全員共通の値を拾ってしまうため、識別子として値がほぼ行ごとに
 * 異なることを条件に加える。
 */
function pickIdCol(rows){
  var w = width(rows), best = -1, bestD = 0;
  for (var c = 0; c < w; c++){
    var vals = {}, tot = 0, hit = 0;
    for (var i = 0; i < rows.length; i++){
      var v = rows[i][c];
      if (v === undefined || String(v).trim() === '') continue;
      var sv = String(v).trim();
      tot++;
      if (isNo(sv)){ hit++; vals[sv.replace(/[\s　,]/g,'')] = 1; }
    }
    if (tot < Math.max(1, rows.length * 0.5) || hit < tot * 0.9) continue;
    var d = Object.keys(vals).length;
    if (d < Math.max(2, tot * 0.8)) continue;      // 全行同じ値の列は識別子ではない
    if (d > bestD){ bestD = d; best = c; }
  }
  return best;
}

/**
 * 氏名の列を選ぶ。名簿には保護者氏名も入っており、異なり数だけで選ぶと取り違える。
 * どちらの表でも氏名は生徒番号のすぐ右にあるため、右隣から探して最初に見つかった
 * テキスト列を優先する。見つからなければ異なり数で選ぶ。
 */
function pickNameCol(rows, skip, noCol){
  if (noCol >= 0){
    var w = width(rows);
    for (var c = noCol + 1; c < w; c++){
      if (skip && skip.indexOf(c) >= 0) continue;
      var vals = {}, tot = 0, txt = 0;
      for (var i = 0; i < rows.length; i++){
        var s = String(rows[i][c] == null ? '' : rows[i][c]).trim();
        if (!s) continue;
        tot++;
        if (/[^\d\-\/:.]/.test(s) && s.length <= 20){ txt++; vals[s] = 1; }
      }
      if (!tot || txt < tot * 0.8) continue;
      // 校舎名のように全員同じ値の列は氏名ではない
      if (Object.keys(vals).length < Math.max(2, tot * 0.5)) continue;
      return c;
    }
  }
  return pickTextCol(rows, skip);
}

var isNo    = function(v){ return /^\d{4,9}$/.test(v.replace(/[\s　,]/g,'')); };
var isGrade = function(v){ return /^(高|中|小)[0-9０-９一二三１２３]$|^(既卒|高卒)$/.test(v); };
var isKana  = function(v){ return /^[ァ-ヶー][ァ-ヶー\s　]*$/.test(v); };
var isDate  = function(v){ return xlDate(v) !== ''; };
var isTime  = function(v){ return xlTime(v) !== ''; };
var isSchool = function(v){ return /(高校|高等学校|中学|学園|学院)$/.test(v); };

function colName(i){ return i < 0 ? '—' : (i + 1) + '列目'; }

/** 生徒名簿の列を決める */
function detectRoster(rows){
  var h = stripHeader(rows), body = h.body, idx = {};
  if (h.head){
    var want = { no:['マナビス生番号','生徒番号','番号','生番号'], name:['氏名','生徒氏名','名前'],
                 kana:['氏名カナ','フリガナ','ふりがな','カナ'], grade:['学年'], school:['学校名','高校名','在籍校'] };
    Object.keys(want).forEach(function(k){
      for (var c = 0; c < h.head.length; c++){
        if (want[k].indexOf(h.head[c]) >= 0){ idx[k] = c; return; }
      }
    });
  }
  var used = [];
  function set(k, c){ if (idx[k] === undefined && c >= 0){ idx[k] = c; } if (idx[k] !== undefined) used.push(idx[k]); }
  set('no',    pickIdCol(body));
  set('grade', pickCol(body, isGrade, used));
  set('kana',  pickCol(body, isKana, used));
  set('school',pickCol(body, isSchool, used));
  set('name',  pickNameCol(body, used, idx.no === undefined ? -1 : idx.no));

  var items = [];
  body.forEach(function(r){
    var no = String(r[idx.no] == null ? '' : r[idx.no]).replace(/\D/g,'');
    if (!no) return;
    items.push({
      no: no,
      name:   idx.name   !== undefined ? String(r[idx.name]   || '').trim() : '',
      kana:   idx.kana   !== undefined ? String(r[idx.kana]   || '').trim() : '',
      grade:  idx.grade  !== undefined ? String(r[idx.grade]  || '').trim() : '',
      school: idx.school !== undefined ? String(r[idx.school] || '').trim() : ''
    });
  });
  var note = '生徒番号=' + colName(idx.no === undefined ? -1 : idx.no) +
             '　氏名=' + colName(idx.name === undefined ? -1 : idx.name) +
             '　カナ=' + colName(idx.kana === undefined ? -1 : idx.kana) +
             '　学年=' + colName(idx.grade === undefined ? -1 : idx.grade) +
             '　高校名=' + colName(idx.school === undefined ? -1 : idx.school);
  if (idx.no === undefined) note = '生徒番号らしい列（4〜9桁の数字）が見つかりませんでした。';
  else if (idx.name === undefined) note += '　※氏名の列が特定できませんでした';
  return { items: items, note: note, idx: idx };
}

/** 来校予約の列を決める。日付の列が無ければ fallbackDate を使う。 */
function detectRes(rows, fallbackDate){
  var h = stripHeader(rows), body = h.body, idx = {};
  if (h.head){
    var want = { no:['番号','マナビス生番号','生徒番号','生番号'], name:['氏名','生徒氏名','名前'],
                 grade:['学年'], date:['予約日','来校日','日付'], at:['予約時刻','来校予定時刻','時刻','時間'] };
    Object.keys(want).forEach(function(k){
      for (var c = 0; c < h.head.length; c++){
        if (want[k].indexOf(h.head[c]) >= 0){ idx[k] = c; return; }
      }
    });
  }
  var used = [];
  function set(k, c){ if (idx[k] === undefined && c >= 0){ idx[k] = c; } if (idx[k] !== undefined) used.push(idx[k]); }
  set('no',    pickIdCol(body));
  set('at',    pickCol(body, isTime, used));
  set('date',  pickCol(body, isDate, used));
  set('grade', pickCol(body, isGrade, used));
  set('name',  pickNameCol(body, used, idx.no === undefined ? -1 : idx.no));

  var items = [];
  body.forEach(function(r){
    var no = String(r[idx.no] == null ? '' : r[idx.no]).replace(/\D/g,'');
    if (!no) return;
    var dt = idx.date !== undefined ? xlDate(r[idx.date]) : '';
    if (!dt) dt = fallbackDate || '';
    if (!dt) return;
    items.push({
      no: no, date: dt,
      name:  idx.name  !== undefined ? String(r[idx.name] || '').trim() : '',
      grade: idx.grade !== undefined ? String(r[idx.grade] || '').trim() : '',
      at:    idx.at    !== undefined ? xlTime(r[idx.at]) : ''
    });
  });
  var note = '生徒番号=' + colName(idx.no === undefined ? -1 : idx.no) +
             '　氏名=' + colName(idx.name === undefined ? -1 : idx.name) +
             '　学年=' + colName(idx.grade === undefined ? -1 : idx.grade) +
             '　予約日=' + (idx.date === undefined ? '列なし（下の日付を使用）' : colName(idx.date)) +
             '　予約時刻=' + colName(idx.at === undefined ? -1 : idx.at);
  if (idx.no === undefined) note = '生徒番号らしい列（4〜9桁の数字）が見つかりませんでした。';
  else if (idx.at === undefined) note += '　※予約時刻の列が特定できません。遅刻と要電話の判定ができなくなります';
  return { items: items, note: note, idx: idx };
}

/* ---------- ファイルからの取り込み ---------- */

function readSheet(file){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onload = function(){
      try {
        var wb = XLSX.read(new Uint8Array(fr.result), { type:'array' });
        res(wb);
      } catch(e){ rej(new Error('ファイルを読めませんでした')); }
    };
    fr.onerror = function(){ rej(new Error('ファイルを読めませんでした')); };
    fr.readAsArrayBuffer(file);
  });
}

function sheetRows(wb, name){
  return XLSX.utils.sheet_to_json(wb.Sheets[name], { header:1, raw:true, defval:'' })
    .filter(function(r){ return r.some(function(c){ return String(c==null?'':c).trim() !== ''; }); });
}

function importFile(file, kind){
  $(kind === 'roster' ? 'lblRos' : 'lblRes').textContent = '読み込み中…';
  readSheet(file).then(function(wb){
    // 目的に合うシートを選ぶ。無ければ行数が最も多いシート。
    var pick = null, bestN = -1;
    wb.SheetNames.forEach(function(n){
      var rows = sheetRows(wb, n);
      var want = kind === 'roster' ? /名簿|顧客/.test(n) : (/予約/.test(n) && !/未予約/.test(n));
      var score = rows.length + (want ? 100000 : 0);
      if (score > bestN){ bestN = score; pick = rows; }
    });
    if (!pick || pick.length < 2) throw new Error('表が見つかりませんでした');
    var fallback = kind === 'res' ? ($('resDate') ? $('resDate').value : '') : '';
    var r = kind === 'roster' ? detectRoster(pick) : detectRes(pick, fallback);
    pending[kind] = r.items;
    $(kind === 'roster' ? 'pvRos' : 'pvRes').innerHTML = reportHtml(r, kind);
    var b = $('pvGo-' + kind);
    if (b) b.addEventListener('click', function(){ send(kind); });
    $(kind === 'roster' ? 'lblRos' : 'lblRes').textContent = file.name;
  }).catch(function(e){ toast(e.message); render(); });
}
